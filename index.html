<title>قائمة النيلين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cormorant+Garamond:wght@500;700&display=swap">
<style>
/* Layout: an underwater hero card (swimming fish, bubbles, light rays), a moving ribbon, a sticky search + plate-icon category rail, then one banner per category with its own animated plate. */
:root {
  --bg: #120c0b;
  --surface: #1b1210;
  --raise: #271a17;
  --line: #3b2b26;
  --ink: #f3eadf;
  --muted: #b5a497;
  --ember: #c22f23;
  --gold: #e0af55;
  --deep: #0b2229;
  --deep2: #123741;
  --f-display: 'Reem Kufi', 'Noto Kufi Arabic', 'Segoe UI', sans-serif;
  --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
html[lang="en"] { --f-display: 'Cormorant Garamond', Georgia, serif; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
}
.wrap { position: relative; z-index: 1; max-width: 1080px; margin-inline: auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

/* ambient bubbles behind the whole page */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; direction: ltr; }
.bub {
  position: absolute; bottom: -24px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.28);
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.3), rgba(255,255,255,.03));
  animation: rise-b var(--d) linear var(--dl) infinite;
}
.ambient .bub { opacity: .5; animation-name: rise-v; }
@keyframes rise-b { 0% { transform: translate3d(0,0,0); opacity: 0; } 12% { opacity: .9; } 50% { transform: translate3d(10px,-280px,0); } 100% { transform: translate3d(-8px,-620px,0); opacity: 0; } }
@keyframes rise-v { 0% { transform: translate3d(0,0,0); opacity: 0; } 10% { opacity: .55; } 50% { transform: translate3d(14px,-60vh,0); } 100% { transform: translate3d(-10px,-118vh,0); opacity: 0; } }

/* top utility row */
.topline { display: flex; justify-content: flex-end; padding-block: 14px 12px; }
.lang {
  min-height: 40px; padding: 0 16px; border-radius: 999px;
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  font-size: 0.9rem; transition: border-color .25s, color .25s;
}
.lang:hover { border-color: var(--gold); color: var(--ink); }

/* hero */
.hero {
  position: relative; isolation: isolate; overflow: hidden; text-align: center;
  border-radius: 28px; border: 1px solid #1f4650; min-height: 460px;
  padding: 56px 20px 104px; display: flex; flex-direction: column; justify-content: center;
}
.scene { position: absolute; inset: 0; z-index: -1; direction: ltr; overflow: hidden;
  background: linear-gradient(180deg, var(--deep) 0%, var(--deep2) 42%, #17201f 78%, #1a1210 100%); }
.rays { position: absolute; inset: 0; }
.ray {
  position: absolute; top: -10%; height: 120%; width: 90px;
  background: linear-gradient(180deg, rgba(150,225,235,.22), rgba(150,225,235,0) 80%);
  transform: skewX(-18deg); animation: sway 9s ease-in-out infinite alternate;
}
.ray:nth-child(1) { left: 12%; animation-delay: -2s; }
.ray:nth-child(2) { left: 46%; width: 140px; animation-delay: -5s; animation-duration: 12s; }
.ray:nth-child(3) { left: 78%; width: 70px; animation-delay: -7s; animation-duration: 10s; }
@keyframes sway { from { opacity: .25; transform: skewX(-18deg) translateX(-22px); } to { opacity: .9; transform: skewX(-18deg) translateX(26px); } }
.surface { position: absolute; top: 0; left: 0; width: 200%; height: 30px; animation: slide 14s linear infinite; }
.surface path { fill: none; stroke: rgba(200,240,245,.45); stroke-width: 2; }
@keyframes slide { to { transform: translateX(-50%); } }
.floor { position: absolute; inset-inline: 0; bottom: 0; height: 90px; background: linear-gradient(0deg, #1a1210 12%, rgba(26,18,16,0)); }

.fish { position: absolute; left: 0; top: var(--top); width: var(--w); opacity: var(--o, 1); animation: swim var(--dur) linear var(--delay) infinite; }
.fish.rev { animation-name: swim-rev; }
.fish .bob { animation: bob 3.6s ease-in-out infinite alternate; }
.fish.rev svg { transform: scaleX(-1); }
.fish svg { display: block; width: 100%; height: auto; overflow: visible; }
.tail { transform-box: fill-box; transform-origin: 100% 50%; animation: wag var(--wag, .55s) ease-in-out infinite alternate; }
.rev .tail { transform-origin: 100% 50%; }
@keyframes swim { from { transform: translate3d(-180px,0,0); } to { transform: translate3d(calc(var(--sw, 400px) + 40px),0,0); } }
@keyframes swim-rev { from { transform: translate3d(calc(var(--sw, 400px) + 40px),0,0); } to { transform: translate3d(-180px,0,0); } }
@keyframes bob { from { transform: translateY(-7px) rotate(-2deg); } to { transform: translateY(7px) rotate(2deg); } }
@keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }


.hero-in { position: relative; z-index: 2; }
.hero .kicker { color: var(--gold); letter-spacing: .18em; font-size: .8rem; text-transform: uppercase; font-weight: 500; }
html[lang="ar"] .hero .kicker { letter-spacing: 0; font-size: .95rem; }
.hero h1 {
  font-family: var(--f-display); font-weight: 700; margin: 8px 0 0; text-wrap: balance;
  font-size: clamp(4rem, 19vw, 8.5rem); line-height: 1.05; text-shadow: 0 6px 34px rgba(0,0,0,.55);
}
.hero .sub { font-family: var(--f-display); font-size: clamp(1.3rem, 5.4vw, 2rem); margin: 4px 0 0; font-weight: 500; text-shadow: 0 3px 18px rgba(0,0,0,.6); }
.cta {
  margin-top: 28px; min-height: 54px; padding: 0 36px; border-radius: 999px; border: 0;
  background: var(--ember); color: #fff; font-weight: 600; font-size: 1.05rem;
  box-shadow: 0 12px 32px -10px rgba(194,47,35,.9);
  transition: transform .25s ease, background .25s ease;
}
.cta:hover { background: #d23a2d; transform: translateY(-2px); }
.cta:active { transform: translateY(0) scale(.98); }
.enter > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.enter > *:nth-child(1) { animation-delay: .05s; }
.enter > *:nth-child(2) { animation-delay: .2s; }
.enter > *:nth-child(3) { animation-delay: .35s; }
.enter > *:nth-child(4) { animation-delay: .5s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* moving ribbon */
.ribbon { direction: ltr; overflow: hidden; margin-top: 16px; border-block: 1px solid var(--line); padding-block: 10px; display: grid; gap: 4px; }
.track { display: flex; width: max-content; animation: marq 46s linear infinite; }
.track.b { animation: marq-rev 58s linear infinite; }
.ribbon:hover .track { animation-play-state: paused; }
.set { display: flex; align-items: center; flex: none; }
.set span { font-family: var(--f-display); white-space: nowrap; padding-inline: 18px; display: inline-block; }
.set svg { width: 34px; height: 20px; flex: none; }
/* row 1: gold light sweeps across the words while each word rides a small wave */
.track.a .w {
  font-size: 1.35rem; color: var(--gold);
  background: linear-gradient(100deg, #b9822a 0%, #e0af55 35%, #fff4d2 50%, #e0af55 65%, #b9822a 100%) 0 0 / 250% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 3.6s linear infinite, wave 3.2s ease-in-out infinite;
  animation-delay: calc(var(--k, 0) * -.4s), calc(var(--k, 0) * -.45s);
}
/* row 2: outlined words that fill with colour and breathe, running the other way in the other language */
.track.b .w {
  font-size: 1.05rem; color: transparent; -webkit-text-stroke: 1px #8d7561;
  animation: fillpulse 5s ease-in-out infinite, breathe 5s ease-in-out infinite;
  animation-delay: calc(var(--k, 0) * -.7s);
}
.track .ic { padding: 0; display: inline-flex; animation: spinflip 6s ease-in-out infinite; animation-delay: calc(var(--k, 0) * -.9s); }
@keyframes marq { to { transform: translateX(-50%); } }
@keyframes marq-rev { from { transform: translateX(-50%); } to { transform: translateX(0); } }
@keyframes shimmer { to { background-position: -250% 0; } }
@keyframes wave { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
@keyframes fillpulse { 0%, 100% { color: transparent; -webkit-text-stroke-color: #8d7561; } 50% { color: var(--ember); -webkit-text-stroke-color: #f08a7e; } }
@keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
@keyframes spinflip { 0%, 70%, 100% { transform: rotateY(0) scale(1); } 85% { transform: rotateY(180deg) scale(1.2); } }

/* sticky bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-top: 14px;
  margin-inline: -16px; padding: 10px 16px 0;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1080px; margin-inline: auto; }
.search { position: relative; }
.search input {
  width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); padding-inline: 44px 44px; font-size: 1rem;
  transition: border-color .2s, box-shadow .2s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(224,175,85,.18); }
.search svg { position: absolute; inset-inline-start: 14px; top: 14px; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
.clear { position: absolute; inset-inline-end: 6px; top: 6px; width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; line-height: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; scroll-snap-align: center; min-height: 50px; padding: 0 20px 0 8px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  transition: background .3s ease, color .3s ease, border-color .3s ease;
}
html[dir="rtl"] .chip { padding: 0 8px 0 20px; }
.chip .ci { width: 34px; height: 34px; flex: none; }
.chip .ci svg { width: 100%; height: 100%; display: block; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #fff; font-weight: 600; }

/* menu list */
main { padding-block: 24px 40px; min-height: 60vh; }
.cat { margin-bottom: 44px; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
.cat-head {
  display: flex; align-items: center; gap: 18px; padding: 14px 18px; margin-bottom: 6px;
  border-radius: 24px; border: 1px solid var(--line);
  background: linear-gradient(90deg, rgba(194,47,35,.28), rgba(194,47,35,.04) 70%), var(--surface);
}
html[dir="rtl"] .cat-head { background: linear-gradient(270deg, rgba(194,47,35,.28), rgba(194,47,35,.04) 70%), var(--surface); }
.cat-plate { flex: none; width: 104px; height: 104px; animation: bob 5s ease-in-out infinite alternate; filter: drop-shadow(0 12px 14px rgba(0,0,0,.5)); }
.cat-plate svg, .art svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cat-head .t { min-width: 0; display: grid; gap: 2px; }
.cat-head h2 { font-family: var(--f-display); font-size: clamp(1.8rem, 6.5vw, 2.5rem); font-weight: 700; margin: 0; line-height: 1.2; }
.cat-head .count { color: var(--gold); font-size: .95rem; }
.items { display: grid; grid-template-columns: 1fr; column-gap: 40px; }
@media (min-width: 760px) { .items { grid-template-columns: 1fr 1fr; } .cat-plate { width: 128px; height: 128px; } }
.row {
  display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 60px; padding: 15px 6px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: start;
  transition: background .25s ease; animation: rise .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms);
}
.row:hover { background: rgba(255,255,255,.04); }
.row:active { background: rgba(255,255,255,.07); }
.row .name { flex: 0 1 auto; min-width: 0; font-size: 1.1rem; font-weight: 500; overflow-wrap: anywhere; }
.row .dots { flex: 1 1 24px; min-width: 16px; border-bottom: 2px dotted #5a433b; transform: translateY(-5px); }
.row .price { flex: none; color: var(--gold); font-weight: 600; font-size: 1.2rem; font-variant-numeric: tabular-nums; direction: ltr; }
.row .cur { font-size: .75rem; color: var(--muted); margin-inline-start: 4px; font-weight: 400; }
.row .flag { flex: none; font-size: .75rem; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 0 8px; }
.row.off .name { color: var(--muted); }
.row.off .price { color: var(--muted); text-decoration: line-through; }
.row.off .flag { color: var(--muted); border-color: var(--line); }

.state { text-align: center; padding-block: 56px; color: var(--muted); }
.state h3 { font-family: var(--f-display); color: var(--ink); font-size: 1.6rem; margin: 0 0 8px; }
.state button { margin-top: 16px; min-height: 44px; padding: 0 22px; border-radius: 999px; background: transparent; border: 1px solid var(--gold); color: var(--gold); }
.skel { height: 58px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* plate steam */
.steam path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0; animation: steam 3.4s ease-in-out infinite; }
.steam path:nth-child(2) { animation-delay: 1.1s; }
.steam path:nth-child(3) { animation-delay: 2.2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 45% { opacity: .6; } 100% { opacity: 0; transform: translateY(-14px); } }

/* footer */
footer { border-top: 1px solid var(--line); padding-block: 32px 48px; display: grid; gap: 14px; text-align: center; justify-items: center; }
footer h2 { font-family: var(--f-display); font-size: 1.4rem; margin: 0; }
.phones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.phone { min-height: 52px; display: inline-flex; align-items: center; gap: 10px; padding: 0 24px; border-radius: 999px; border: 1px solid #2f6b47; background: rgba(79,174,120,.12); color: #8fe0ae; text-decoration: none; direction: ltr; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; transition: background .25s; }
.phone:hover { background: rgba(79,174,120,.22); }
.phone svg { width: 20px; height: 20px; fill: currentColor; }
.pay-h { margin-top: 14px; }
.pay { display: grid; gap: 12px; width: 100%; max-width: 480px; }
.pay-hint { margin: 0; color: var(--muted); font-size: .9rem; }
.pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 339px) { .pay-grid { grid-template-columns: 1fr; } }
.pm {
  --c: var(--gold); --ic: #fff; position: relative; overflow: hidden; min-width: 0; min-height: 118px; padding: 12px 14px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px;
  border-radius: 20px; border: 0; text-align: start; color: var(--ic);
  background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 50%, #000));
  box-shadow: 0 16px 26px -18px var(--c);
  transition: transform .3s cubic-bezier(.2,.8,.3,1.2), box-shadow .3s ease, opacity .3s ease, filter .3s ease;
}
.pm::before { content: ""; position: absolute; inset-inline-end: -28px; top: -34px; width: 118px; height: 118px; border-radius: 50%; background: rgba(255,255,255,.15); pointer-events: none; }
.pm:hover { transform: translateY(-3px); }
.pm:active { transform: scale(.97); }
.pm[aria-pressed="true"] { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c), 0 22px 30px -14px var(--c); }
.pay-grid.sel .pm[aria-pressed="false"] { opacity: .55; filter: saturate(.55); }
.pm .lg { flex: none; width: 52px; height: 52px; display: block; animation: emfloat 3.4s ease-in-out infinite alternate; }
.pm:nth-child(2) .lg { animation-delay: -.8s; } .pm:nth-child(3) .lg { animation-delay: -1.6s; } .pm:nth-child(4) .lg { animation-delay: -2.4s; }
@keyframes emfloat { from { transform: translateY(-2px) rotate(-3deg); } to { transform: translateY(3px) rotate(3deg); } }
.pm .lg svg, .pd-em svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pm .e1, .pd-em .e1 { fill: var(--ic); }
.pm .e2, .pd-em .e2 { fill: var(--ic); opacity: .45; }
.pm .cut, .pd-em .cut { fill: var(--c); }
.pm .st, .pd-em .st { fill: none; stroke: var(--ic); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pm .nm { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; min-width: 0; overflow-wrap: anywhere; color: var(--ic); }
.pm .ck { position: absolute; top: 10px; inset-inline-start: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--ic); display: grid; place-items: center; transform: scale(0); transition: transform .35s cubic-bezier(.2,.9,.3,1.5); }
.pm .ck svg { width: 14px; height: 14px; fill: none; stroke: var(--c); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.pm[aria-pressed="true"] .ck { transform: scale(1); }
.pay-d {
  --c: var(--gold); display: grid; gap: 10px; text-align: start; padding: 14px 16px; border-radius: 18px;
  border: 1px solid #6d5320; border-inline-start: 4px solid var(--c);
  background: linear-gradient(90deg, rgba(224,175,85,.14), rgba(224,175,85,.03)); animation: rise .4s cubic-bezier(.2,.7,.2,1) both;
}
.pay-d .hd { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; }
.pay-d .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pay-d .num { min-width: 0; color: var(--gold); font-size: 1.35rem; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; direction: ltr; user-select: all; overflow-wrap: anywhere; }
.pay-d .num.none { color: var(--muted); font-size: 1rem; font-weight: 400; letter-spacing: 0; direction: inherit; user-select: none; }
.pay-d .copy { flex: none; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--gold); background: transparent; color: var(--gold); transition: background .25s, color .25s; }
.pay-d .copy:hover { background: rgba(224,175,85,.16); }
.pay-d .copy.ok { background: var(--gold); color: #1a1210; }
.pay-d .own { color: var(--muted); font-size: .9rem; display: grid; gap: 0; }
.pay-d .own strong { color: var(--ink); font-weight: 600; font-size: 1.05rem; }

/* detail sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5,2,2,.74); display: none; align-items: flex-end; justify-content: center; }
.scrim.on { display: flex; animation: fade .3s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: relative; width: 100%; max-width: 520px; max-height: 90%; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px 24px 0 0;
  padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); animation: up .4s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 24px; animation-name: pop; } @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } } }
.art {
  height: 250px; display: grid; place-items: center; overflow: hidden; position: relative;
  background: radial-gradient(70% 90% at 50% 0%, rgba(194,47,35,.55), rgba(194,47,35,0) 75%), var(--raise);
}
.art .plate-big { width: 200px; height: 200px; animation: bob 5s ease-in-out infinite alternate; filter: drop-shadow(0 16px 18px rgba(0,0,0,.5)); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(18,12,11,.75); font-size: 1.4rem; line-height: 1; }
.sheet-body { padding: 22px 24px 0; display: grid; gap: 10px; }
.sheet .cat-tag { color: var(--gold); font-size: .9rem; }
.sheet h2 { font-family: var(--f-display); font-size: 2rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.sheet .desc { color: var(--muted); margin: 0; }
.sheet .big { color: var(--gold); font-size: 2.3rem; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }
.sheet .big small { font-size: 1rem; color: var(--muted); font-weight: 400; margin-inline-start: 6px; }
.sheet .status { color: var(--muted); font-size: .95rem; }


/* ===== prestige layer: loader, moving plate showcase, plate thumbs, gold finish ===== */
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:26px;direction:ltr;background:radial-gradient(80% 60% at 50% 38%,#164553,#0b2229 62%,#06141a);transition:opacity .7s ease,transform .9s cubic-bezier(.7,0,.3,1),visibility 0s .9s}
.loader.out{opacity:0;transform:scale(1.12);visibility:hidden;pointer-events:none}
.ptw{position:relative}

function validate(raw) {
  const seen = new Set(), cats = [];
  for (const c of (raw && raw.categories) || []) {
    if (!c || !c.id || !c.name || !c.name.ar) { console.warn("Skipped category without id/name", c); continue; }
    const items = [];
    for (const it of c.items || []) {
      const ok = it && it.id && it.name && String(it.name.ar || "").trim() && typeof it.price === "number" && it.price >= 0;
      if (!ok) { console.warn("Skipped invalid item", it); continue; }
      if (seen.has(it.id)) { console.warn("Duplicate id skipped", it.id); continue; }
      seen.add(it.id);
      items.push({ description: null, image: null, status: "available", featured: false, ...it });
    }
    cats.push({ ...c, items });
  }
  return { meta: raw.meta || {}, categories: cats };
}

  data.categories.forEach(c => add(c.id, pick(c.name).replace(/^قسم /, ""), art(c.art)));
}

function matches(item, cat) {
  if (!query) return true;
  const q = norm(query);
  return [item.name.ar, item.name.en, cat.name.ar, cat.name.en, item.description && item.description.ar, item.description && item.description.en]
    .some(v => v && norm(v).includes(q));
}

function renderList() {
  const box = $("list"); box.textContent = "";
  const s = t();
  let shown = 0;
  for (const c of data.categories.filter(c => active === "all" || c.id === active)) {
    const items = c.items.filter(i => matches(i, c));
    if (!items.length) continue;
    shown += items.length;
    const sec = el("section", "cat");
    const head = el("div", "cat-head");
    const pl = el("div", "cat-plate"); pl.innerHTML = art(c.art); head.appendChild(pl);
    const tx = el("div", "t");
    const h = el("h2", null, pick(c.name)); h.dir = "auto";
    tx.appendChild(h); tx.appendChild(el("span", "count", s.items(items.length)));
    head.appendChild(tx);
    const cf = el("div", "cat-fish"); cf.style.animationDuration = rnd(13, 22).toFixed(1) + "s"; cf.style.animationDelay = "-" + rnd(0, 12).toFixed(1) + "s"; cf.innerHTML = fishSVG("#e0af55", "#f6d58b", "#c2872a"); head.appendChild(cf);
    sec.appendChild(head);
    const grid = el("div", "items");
    items.forEach((i, n) => { const r = row(i, c); r.style.setProperty("--i", Math.min(n, 10)); grid.appendChild(r); });
    sec.appendChild(grid); box.appendChild(sec);
  }
  if (!shown) {
    const st = el("div", "state");
    st.appendChild(el("h3", null, query ? s.empty : s.noneCat));
    if (query) {
      st.appendChild(el("p", null, s.emptyHint));
      const b = el("button", null, s.clear); b.type = "button";
      b.addEventListener("click", () => { $("q").value = ""; setQuery(""); $("q").focus(); });
      st.appendChild(b);
    }
    box.appendChild(st);
  }
}

function row(item, cat) {
  const off = item.status !== "available";
  const b = el("button", "row" + (off ? " off" : ""));
  b.type = "button";
  const th = el("span", "th"); th.innerHTML = art(item.art || cat.art); b.appendChild(th);
  const n = el("span", "name", pick(item.name)); n.dir = "auto";
  b.appendChild(n); b.appendChild(el("span", "dots"));
  if (off) b.appendChild(el("span", "flag", item.status === "soldout" ? t().sold : t().temp));
  b.appendChild(priceNode(item, "price"));
  b.addEventListener("click", () => openSheet(item, cat));
  return b;
}

function copyText(text, btn, numEl) {
  const done = () => { btn.textContent = t().copied; btn.classList.add("ok"); setTimeout(() => { btn.textContent = t().copy; btn.classList.remove("ok"); }, 1600); };
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy"); document.body.removeChild(ta);
      if (ok) { done(); return; }
    } catch (e) {}
    const r = document.createRange(); r.selectNodeContents(numEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  } catch (e) { fallback(); }
}

/* ---------------- payment methods ---------------- */

};
const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let payActive = null;
const isSet = v => !!v && !/^PLACEHOLDER/.test(String(v));

function fillPay(panel) {
  const p = (data.meta.payments || []).find(x => x.id === payActive);
  panel.textContent = "";
  if (!p) { panel.hidden = true; return; }
  const s = t();
  panel.hidden = false;
  panel.style.setProperty("--c", p.color || "var(--gold)");
  panel.style.animation = "none"; void panel.offsetWidth; panel.style.animation = "";
  const hd = el("div", "hd"); panel.style.setProperty("--ic", p.ink || "#fff");
  const em = el("span", "pd-em"); em.innerHTML = PAY_ICON[p.id] || ""; hd.appendChild(em); hd.appendChild(el("span", null, p.name)); panel.appendChild(hd);
  const line = el("div", "line");
  if (isSet(p.number)) {
    const num = el("span", "num", p.number); line.appendChild(num);
    const b = el("button", "copy", s.copy); b.type = "button";
    b.addEventListener("click", () => copyText(p.number, b, num));
    line.appendChild(b);
  } else {
    line.appendChild(el("span", "num none", s.noAcct));
  }
  panel.appendChild(line);
  if (isSet(p.holder)) {
    const o = el("div", "own"); o.appendChild(el("span", null, s.owner));
    const nm = el("strong", null, p.holder); nm.dir = "auto"; o.appendChild(nm);
    panel.appendChild(o);
  }
}

function renderFoot() {
  const f = $("foot"); f.textContent = "";
  const m = data.meta, s = t();
  const phones = m.phones || [], accts = m.payments || [];
  if (!phones.length && !accts.length) return;
  if (phones.length) {
    f.appendChild(el("h2", null, s.contact));
    const p = el("div", "phones");
    phones.forEach(ph => {
      const a = el("a", "phone"); a.href = "tel:" + ph.replace(/\s/g, "");
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3h3l1.4 4-2 1.4a11 11 0 0 0 5.6 5.6L16 12l4 1.4v3A3.6 3.6 0 0 1 16.4 20 15.4 15.4 0 0 1 4 7.6 3.6 3.6 0 0 1 6.6 3z"/></svg>';
      a.appendChild(el("span", null, ph)); a.setAttribute("aria-label", s.call + " " + ph);
      p.appendChild(a);
    });
    f.appendChild(p);
  }
  if (accts.length) {
    f.appendChild(el("h2", "pay-h", s.pay));

    box.appendChild(el("p", "pay-hint", s.payHint));
    const grid = el("div", "pay-grid");
    const panel = el("div", "pay-d"); panel.setAttribute("aria-live", "polite"); panel.hidden = true;
    accts.forEach(p => {
      const b = el("button", "pm"); b.type = "button"; b.dataset.id = p.id;
      b.style.setProperty("--c", p.color || "var(--gold)"); b.style.setProperty("--ic", p.ink || "#fff");

        payActive = payActive === p.id ? null : p.id;

        grid.classList.toggle("sel", !!payActive);
        fillPay(panel);
        if (payActive) setTimeout(() => { try { panel.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {} }, 80);
      });
      grid.appendChild(b);
    });
    grid.classList.toggle("sel", !!payActive);
    box.appendChild(grid); box.appendChild(panel); f.appendChild(box);
    fillPay(panel);
  }
}

/* ---------------- interaction ---------------- */
function selectCat(id) {
  active = id;
  document.querySelectorAll(".chip").forEach(c => {
    const on = c.dataset.id === id;
    c.setAttribute("aria-pressed", String(on));
    if (on) c.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  renderList();
  const y = $("list").offsetTop - $("bar").offsetHeight - 8;
  if (window.scrollY > y) window.scrollTo({ top: y, behavior: "smooth" });
}
function setQuery(v) { query = v.trim(); $("clear").hidden = !v; renderList(); }

function openSheet(item, cat) {
  lastFocus = document.activeElement;
  const s = t();
  $("s-cat").textContent = pick(cat.name);
  $("s-name").textContent = pick(item.name);
  const artBox = $("s-art");
  artBox.querySelectorAll("img").forEach(i => i.remove());
  $("s-plate").innerHTML = art(item.art || cat.art);
  if (item.image) {
    const im = new Image(); im.alt = pick(item.name); im.loading = "lazy";
    im.onerror = () => im.remove();
    im.src = item.image; artBox.appendChild(im);
  }
  const d = $("s-desc"), desc = item.description && (item.description[lang] || item.description.ar);
  d.hidden = !desc; d.textContent = desc || "";
  const pr = $("s-price"); pr.textContent = fmtPrice(item.price);
  if (data.meta.currency) pr.appendChild(el("small", null, data.meta.currency));
  const st = $("s-status"), off = item.status !== "available";
  st.hidden = !off; st.textContent = off ? (item.status === "soldout" ? s.sold : s.temp) : "";
  $("scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  $("s-close").focus();
}
function closeSheet() {
  $("scrim").classList.remove("on");
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function bind() {
  $("q").addEventListener("input", e => setQuery(e.target.value));
  $("clear").addEventListener("click", () => { $("q").value = ""; setQuery(""); $("q").focus(); });
  $("cta").addEventListener("click", () => $("bar").scrollIntoView({ behavior: "smooth", block: "start" }));
  $("lang").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("nileen-lang", lang); } catch (e) {}
    applyLang();
  });
  $("s-close").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
  document.addEventListener("keydown", e => {
    const on = $("scrim").classList.contains("on");
    if (e.key === "Escape" && on) closeSheet();
    if (e.key === "Tab" && on) { e.preventDefault(); $("s-close").focus(); }
  });
  window.addEventListener("resize", sizeScene);
}


function buildShowcase() {
  const tr = $("show"); tr.textContent = "";
  const mk = dup => {
    const set = el("div", "set"); let k = 0;
    data.categories.forEach(c => c.items.filter(i => i.status === "available").slice(0, 2).forEach(i => {
      const d = el("button", "dish"); d.type = "button"; d.style.setProperty("--k", k++);
      if (dup) d.tabIndex = -1;
      const pl = el("span", "pl"); pl.innerHTML = art(i.art || c.art); d.appendChild(pl);
      const n = el("b", null, pick(i.name)); n.dir = "auto"; d.appendChild(n);
      d.appendChild(priceNode(i, "pr"));
      d.addEventListener("click", () => openSheet(i, c)); set.appendChild(d);
    }));
    return set;
  };
  tr.appendChild(mk(false)); tr.appendChild(mk(true));
}
function runLoader() {
  const ld = $("loader"); if (!ld) return;
  try {
    $("lfish").innerHTML = fishSVG("#e0af55", "#f6d58b", "#c2872a");
    $("lname").textContent = pick(MENU.meta.name);
    const pt = ld.querySelector(".pt"); for (let i = 0; i < 8; i++) pt.appendChild(bubble("", 4, 11, 3, 6));
  } catch (e) {}
  const hide = () => { ld.classList.add("out"); setTimeout(() => ld.remove(), 1100); };
  setTimeout(hide, matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 2700);
}

(async function start() {
  runLoader();
  try { buildScene(); } catch (e) { console.warn("Scene failed", e); }
  try {
    data = validate(await loadMenu());
    if (!data.categories.length) throw new Error("empty menu");
    bind(); applyLang();
  } catch (err) {
    console.error(err);
    const s = UI[lang], box = $("list"); box.textContent = "";
    const st = el("div", "state"); st.appendChild(el("h3", null, s.err)); st.appendChild(el("p", null, s.errHint));
    box.appendChild(st);
  }
})();
</script>

<script>
/* ===== polish layer (visual only; the menu code above is untouched) ===== */
(function () {
  try {
    const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const $ = id => document.getElementById(id);

    /* scroll progress bar + back-to-top ring */
    const pg = document.createElement("div"); pg.className = "pgbar"; pg.setAttribute("aria-hidden", "true"); document.body.appendChild(pg);
    const tt = document.createElement("button"); tt.className = "totop"; tt.type = "button";
    tt.innerHTML = '<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><circle class="prg" cx="24" cy="24" r="20"/></svg><svg class="ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>';
    document.body.appendChild(tt);
    const C = 2 * Math.PI * 20;
    const onScroll = () => {
      const de = document.documentElement, max = de.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
      pg.style.transform = "scaleX(" + p.toFixed(4) + ")";
      tt.style.setProperty("--p", (C * (1 - p)).toFixed(1));
      tt.classList.toggle("show", scrollY > 600);
      tt.setAttribute("aria-label", de.lang === "ar" ? "إلى الأعلى" : "Back to top");
    };
    addEventListener("scroll", onScroll, { passive: true }); addEventListener("resize", onScroll); onScroll();
    tt.addEventListener("click", () => scrollTo({ top: 0, behavior: rm ? "auto" : "smooth" }));

    /* scroll reveal for banners and rows that start below the fold */
    const list = $("list");
    if (!rm && list && "IntersectionObserver" in window) {
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        const t = e.target; t.style.transitionDelay = (t._d || 0) + "ms"; t.classList.add("in"); io.unobserve(t);
      }), { rootMargin: "0px 0px -5% 0px", threshold: 0.06 });
      const prep = () => {
        let k = 0;
        list.querySelectorAll(".row:not([data-rv]), .cat-head:not([data-rv])").forEach(el => {
          el.dataset.rv = "1";
          if (el.getBoundingClientRect().top > innerHeight * 0.92) { el.classList.add("rv"); el._d = (k++ % 5) * 55; io.observe(el); }
        });
      };
      new MutationObserver(prep).observe(list, { childList: true, subtree: true }); prep();
    }

    /* tap / click ripple */
    if (!rm) document.addEventListener("pointerdown", e => {
      const t = e.target.closest && e.target.closest(".row, .chip, .pm, .cta, .copy"); if (!t) return;
      const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, s = document.createElement("span");
      s.className = "rip"; s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
      t.appendChild(s); setTimeout(() => s.remove(), 700);
    }, { passive: true });

    /* hero: golden sparkles + gentle pointer parallax */
    const hero = document.querySelector(".hero");
    if (hero && !rm) {
      const sp = document.createElement("div"); sp.className = "sparks"; sp.setAttribute("aria-hidden", "true");
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("i");
        s.style.cssText = "left:" + (Math.random() * 94 + 3).toFixed(1) + "%;bottom:" + (Math.random() * 38 + 4).toFixed(1) + "%;--s:" + (3 + Math.random() * 6).toFixed(1) + "px;--d:" + (5 + Math.random() * 6).toFixed(1) + "s;--dl:-" + (Math.random() * 9).toFixed(1) + "s";
        sp.appendChild(s);
      }
      hero.appendChild(sp);
      hero.addEventListener("pointermove", e => {
        const r = hero.getBoundingClientRect();
        hero.style.setProperty("--mx", ((e.clientX - r.left) / r.width - 0.5).toFixed(3));
        hero.style.setProperty("--my", ((e.clientY - r.top) / r.height - 0.5).toFixed(3));
      }, { passive: true });
      hero.addEventListener("pointerleave", () => { hero.style.setProperty("--mx", 0); hero.style.setProperty("--my", 0); });
    }
  } catch (e) { console.warn("polish layer skipped", e); }
})();
</script>
